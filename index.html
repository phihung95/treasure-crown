<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17130b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c9a23f' d='M2.4 8 6 11l6-6.6L18 11l3.6-3-1.7 9.4H4.1L2.4 8Z'/%3E%3Crect x='4' y='19.2' width='16' height='2.2' rx='1' fill='%2317130b'/%3E%3C/svg%3E" />
  <title>Treasure Crown Collectibles</title>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <svg class="crown" viewBox="0 0 24 24" aria-hidden="true">
        <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6c565"/><stop offset="1" stop-color="#b8912f"/>
        </linearGradient></defs>
        <path fill="url(#cg)" d="M2.4 8 6 11l6-6.6L18 11l3.6-3-1.7 9.4H4.1L2.4 8Z"/>
        <rect x="4" y="19.2" width="16" height="2.4" rx="1.2" fill="#17130b"/>
      </svg>
      <span class="t1">Treasure</span><span class="t2">Crown</span><span class="t3">Collectibles</span>
    </span>
    <span id="sync-pill" class="pill">•</span>
  </header>
  <main id="screen" class="screen"></main>
  <nav class="tabbar">
    <a href="#/dashboard"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
    <a href="#/buy"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M12 3v9m0 0 3.5-3.5M12 12 8.5 8.5M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg><span>Buy</span></a>
    <a href="#/sell"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M20.5 12.5 12 21l-8-8V4.5h8.5l8 8Z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg><span>Sell</span></a>
    <a href="#/trade"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg><span>Trade</span></a>
    <a href="#/inventory"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3ZM3 12l9 4.5L21 12M3 16.5 12 21l9-4.5"/></svg><span>Inventory</span></a>
    <button class="tab-more" id="tab-more" aria-label="More"><svg class="tab-ico" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg><span>More</span></button>
  </nav>
  <div class="more-sheet" id="more-sheet" hidden>
    <div class="more-panel">
      <div class="more-grab"></div>
      <a href="#/shows">Shows</a>
      <a href="#/prints">Prints</a>
      <a href="#/settings">Setup</a>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
